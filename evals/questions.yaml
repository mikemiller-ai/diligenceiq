    expect:
      relevant: "demand for (?:our )?vehicles|consumer demand|price reductions|pricing"
      companies: [TSLA]
      evidence:
        - { ticker: TSLA, sections: [risk_factors, mda], pattern: "demand for (?:our )?(?:vehicles|products)|consumer demand" }
        - { ticker: TSLA, pattern: "price reductions|pricing|prices of our vehicles" }

  - id: multi-cloud
