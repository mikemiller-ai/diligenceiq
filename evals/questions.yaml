    categories: [single-company, longitudinal, revenue]
    expect:
      relevantSections: [mda, financial_statements]
      relevant: "Comirnaty|Paxlovid|revenue"
      companies: [PFE]
      periods: [PFE/FY2022, PFE/FY2023, PFE/FY2024, PFE/FY2025 YTD]
      evidence:
        - { ticker: PFE, period: FY2022, pattern: "Comirnaty|Paxlovid" }
        - { ticker: PFE, period: FY2024, pattern: "Comirnaty|Paxlovid" }

  - id: reg-nvda-export
