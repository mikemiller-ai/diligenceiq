    source: SPEC §51.3 final product test, expert question (verbatim)
    expect:
      relevant: "Digital Markets Act|\\bDMA\\b|antitrust|competition law|App Store|Epic"
      companies: [AAPL]
      periods: [AAPL/FY2023, AAPL/FY2024, AAPL/FY2025]
      evidence:
        - { ticker: AAPL, period: FY2023, pattern: "Digital Markets Act|\\bDMA\\b|antitrust|competition law" }
        - { ticker: AAPL, period: FY2024, pattern: "Digital Markets Act|\\bDMA\\b|antitrust|competition law" }
        - { ticker: AAPL, period: FY2025, pattern: "Digital Markets Act|\\bDMA\\b|antitrust|competition law" }
        - { ticker: AAPL, pattern: "Digital Markets Act" }
      gold:
        - AAPL-FY2023-10K-1A-015
        - AAPL-FY2023-10K-1A-017
        - AAPL-FY2023-10K-LEGAL-001
        - AAPL-FY2024-10K-1A-015
        - AAPL-FY2024-10K-1A-017
        - AAPL-FY2024-10K-LEGAL-001
        - AAPL-FY2024-10K-LEGAL-002
        - AAPL-FY2025-10K-1A-015
        - AAPL-FY2025-10K-1A-016
        - AAPL-FY2025-10K-1A-017
        - AAPL-FY2025-10K-1A-018
        - AAPL-FY2025-10K-LEGAL-001
        - AAPL-FY2025-10K-LEGAL-002

