        - JNJ-FY2025-10K-1A-006
        - PFE-FY2024-10K-1A-006
        - PFE-FY2024-10K-1A-010
        - PFE-FY2024-10K-1A-011
        - PFE-FY2024-10K-1A-013
        - MRK-FY2024-10K-1A-007
        - MRK-FY2024-10K-1A-008
        - MRK-FY2024-10K-1A-017
        - MRK-FY2024-10K-1A-018
        - LLY-FY2025-10K-1A-007
        - LLY-FY2025-10K-1A-011
        - LLY-FY2025-10K-1A-024
        - LLY-FY2025-10K-1A-025
        - ABBV-FY2024-10K-1A-005
        - ABBV-FY2024-10K-1A-006
