      companies: [MSFT, AMZN, GOOG]
      minPerCompany: 5
      evidence:
        - { ticker: MSFT, pattern: "Azure" }
        - { ticker: AMZN, pattern: "\\bAWS\\b|Amazon Web Services" }
        - { ticker: GOOG, pattern: "Google Cloud" }
      gold:
        - MSFT-FY2025-10K-BUS-005
        - MSFT-FY2025-10K-MDA-006
        - AMZN-FY2025-10K-BUS-001
        - AMZN-FY2025-10K-MDA-010
        - AMZN-FY2025-10K-MDA-013
        - GOOG-FY2025-10K-BUS-004
        - GOOG-FY2025-10K-MDA-008
        - GOOG-FY2025-10K-MDA-010

  - id: long-pfe-since-2022
