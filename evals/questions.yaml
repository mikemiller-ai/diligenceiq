      relevant: "Data Center (?:compute )?revenue|revenue (?:for|was|increased|grew)"
      companies: [NVDA]
      periods: [NVDA/FY2024, NVDA/FY2025, NVDA/FY2026 YTD]
      evidence:
        - { ticker: NVDA, period: FY2024, sections: [mda, financial_statements], pattern: "Data Center (?:compute )?revenue" }
        - { ticker: NVDA, period: FY2025, sections: [mda, financial_statements], pattern: "Data Center (?:compute )?revenue" }
        - { ticker: NVDA, period: FY2026 YTD, sections: [mda, financial_statements], pattern: "Data Center (?:compute )?revenue" }
      gold:
        - NVDA-FY2024-10K-MDA-004
        - NVDA-FY2024-10K-MDA-005
        - NVDA-FY2025-10K-MDA-004
        - NVDA-FY2025-10K-MDA-005
        - NVDA-FY2025-10K-MDA-009
        - NVDA-FY2026Q1-10Q-MDA-004
        - NVDA-FY2026Q2-10Q-MDA-004
        - NVDA-FY2026Q3-10Q-MDA-004

