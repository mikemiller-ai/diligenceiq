# DiligenceIQ evaluation set (SPEC §41.1; testing-strategy §7).
#
# 20 questions covering every SPEC §41.1 category: single-company, multi-company, longitudinal,
# risk, revenue, regulatory, cross-sector, unsupported, ambiguous, and adversarial / prompt
# injection. It includes the three assessment PDF questions and the SPEC §51.3 expert question
# VERBATIM (ids pdf-1, pdf-2, pdf-3, expert-1; a test locks their text).
#
# Phase 3 runs these in RETRIEVAL-ONLY mode (`pnpm eval:retrieval`): no generation. The
# `expect` block holds deterministic retrieval checks:
#   companies      every listed ticker has at least one chunk in the context (coverage)
#   periods        every listed ticker/period cell is in the context's coverage matrix
#   evidence       at least one context chunk of `ticker` (and `period`, `sections` when given)
#                  matches `pattern` (case-insensitive): "was supporting evidence retrieved?"
#   minPerCompany  every expected company has at least this many context chunks (no collapse)
#   maxCompanyShare  no single company holds more than this share of the context (global lanes)
#   minCompanies   at least this many distinct companies in the context (global lanes)
#   analysisCompanies  the analyzer detected exactly these tickers (injection, ambiguity)
#   gaps / notes   the Interpretation panel states a gap / a note matching the pattern
#   relevantSections / relevant  informational precision (no pass bar): the share of context
#                  chunks in these sections / whose text matches this pattern. They compare
#                  retrieval modes (BM25, cosine, hybrid) beyond pass/fail.
#   maxCompanies   at most this many distinct companies in the context (injection: scope kept)
#   forbidGaps     no stated gap may match the pattern (injection: a planted period not applied)
#   periodKind     the resolved period kind (injection: filters unchanged)
#   gold           hand-picked chunk IDs that genuinely answer the question; the harness reports
#                  recall@context (share of gold passages in the context), overall and per
#                  company. Informational, not a pass bar.
#
# How the gold chunks were chosen (H6): by a Claude agent on 2026-10-01, BEFORE looking at what
# any retrieval mode returns for these questions, by reading the chunks of index
# iv-9cf51c066743 (.index/build/iv-9cf51c066743/chunks.jsonl) filing by filing and section by
# section. Candidates were located by section listing, by the Phase 2 golden risk-factor
# headings (packages/corpus testing/risk-headings-golden.ts) and by phrase lookup, then read and
# kept only if the passage itself answers the question for that company and period:
#   pdf-1      the latest 10-K's Item 1A chunks that state each company's principal risks (Apple:
#              economy, trade and tariffs, competition, component supply, laws and regulation;
#              Tesla: production ramps, single-source supply, battery cells, EV demand,
#              competition, dependence on Elon Musk; JPMorgan: the risk summary, regulation,
#              market, credit and collateral, cyber).
#   pdf-2      NVIDIA MD&A chunks that state revenue and its drivers: the FY2024 and FY2025
#              fiscal-year summaries and segment drivers, and the Data Center revenue paragraph of
#              each FY2026 10-Q (Q1–Q3).
#   pdf-3      each pharma company's latest 10-K Item 1A chunks on drug pricing (IRA, Medicare,
#              government price setting), FDA and regulatory approval, and regulatory compliance.
#   expert-1   Apple FY2023, FY2024 and FY2025 10-K chunks on laws and regulation, antitrust and
#              the DMA (Item 1A), and the DMA and Epic proceedings with Apple's compliance plans
#              (Item 3).
#   rev-msft-fy2025, multi-cloud, reg-nvda-export: the MD&A, Business and Item 1A chunks that
#              state the revenue drivers, the cloud segment, or the export restrictions.
# A gold set is a sufficient set of answering passages, not every passage that could help, so
# recall below 1.0 is expected even for a good context.
# Phase 4 adds generation checks to the same questions (`pnpm eval:retrieval --generate`;
# packages/rag eval/generation-eval.ts): one call per question, citation validity before and
# after validation, every key finding cited, numeric grounding, brief coverage (each expected
# company cited), and, where an `expect.generation` block says so:
#   abstain / gapPattern   the corpus cannot answer: insufficient_evidence, or the gap stated
#   forbid                 injection: no brief text matches the pattern
#   citeCompanies / maxCitedCompanies   the brief cites these companies / no more than N
version: 1
questions:
  - id: pdf-1
    question: "What are the primary risk factors facing Apple, Tesla, and JPMorgan, and how do they compare?"
    categories: [multi-company, risk, cross-sector]
    source: assessment PDF example 1 (verbatim)
    expect:
      relevantSections: [risk_factors]
      companies: [AAPL, TSLA, JPM]
      minPerCompany: 5
      evidence:
        - { ticker: AAPL, sections: [risk_factors], pattern: "highly competitive|single or limited sources|outsourcing partners" }
        - { ticker: TSLA, sections: [risk_factors], pattern: "production ramp|battery cells|single-source" }
        - { ticker: JPM, sections: [risk_factors], pattern: "credit risk|liquidity risk|capital requirements" }
      gold:
        - AAPL-FY2025-10K-1A-001
        - AAPL-FY2025-10K-1A-002
        - AAPL-FY2025-10K-1A-003
        - AAPL-FY2025-10K-1A-004
        - AAPL-FY2025-10K-1A-006
        - AAPL-FY2025-10K-1A-015
        - TSLA-FY2025-10K-1A-001
        - TSLA-FY2025-10K-1A-002
        - TSLA-FY2025-10K-1A-005
        - TSLA-FY2025-10K-1A-006
        - TSLA-FY2025-10K-1A-007
        - TSLA-FY2025-10K-1A-013
        - JPM-FY2025-10K-1A-001
        - JPM-FY2025-10K-1A-002
        - JPM-FY2025-10K-1A-003
        - JPM-FY2025-10K-1A-012
        - JPM-FY2025-10K-1A-016
        - JPM-FY2025-10K-1A-023

